name: Lint

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prek:
    name: prek
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The make targets run the hooks in the dev container (.devcontainer/), as
      # they do on a developer machine. run.sh pulls the image from GHCR, or
      # builds it when the Dockerfile has changed.
      - name: Validate prek config
        run: make container-run CMD='prek validate-config prek.toml'
      - name: Run prek
        # The branch check protects local protected branches, but must not fail
        # after code lands on the upstream main branch.
        env:
          PREK_SKIP: ${{ (github.ref == 'refs/heads/main') && 'no-commit-to-branch' || '' }}
        run: make lint
