name: Dev container

# Publishes the dev container image to GHCR, so .devcontainer/run.sh, CI, and
# devcontainer.json pull it instead of building it. The image is tagged with
# the hash of .devcontainer/Dockerfile (df-<hash>) and with `latest`.
on:
  push:
    branches: [main]
    paths:
      - .devcontainer/Dockerfile
      - .devcontainer/run.sh
      - .github/workflows/devcontainer.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: devcontainer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the image
        # Inline cache metadata lets `docker build --cache-from` and the
        # devcontainer.json cacheFrom reuse the layers of `latest`.
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}/devcontainer"
          image=$(DEVCONTAINER_IMAGE_REPO="$repo" .devcontainer/run.sh --print-image)
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --cache-from "$repo:latest" \
            --cache-to type=inline \
            --tag "$image" \
            --tag "$repo:latest" \
            --push \
            .devcontainer
