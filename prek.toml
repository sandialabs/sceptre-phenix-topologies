# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
# Run manually: prek run --all-files
#:schema https://www.schemastore.org/prek.json

auto_update.cooldown_days = 30
minimum_prek_version = "0.4.3"
default_language_version.python = "3.12"

# All hooks at the same priority level run concurrently. Hooks with a lower
# priority run first so file fixers complete before validation hooks.
#
# This repository contains topology YAML, shell/Python injects, documentation,
# and generated experiment data. Generated data, vendored drivers, and archived
# wind test harness are excluded from content checks.

# Lint GitHub Actions workflows for security issues.
[[repos]]
repo = "https://github.com/zizmorcore/zizmor-pre-commit"
rev = "v1.26.1"

[[repos.hooks]]
id = "zizmor"
args = [
    "--no-progress",
    "--fix",
]
priority = 3

# Spell checking.
[[repos]]
repo = "https://github.com/codespell-project/codespell"
rev = "v2.4.2"

[[repos.hooks]]
id = "codespell"
args = [
    "--ignore-words-list",
    "ue,ot,ues,fo,nd,ist,te,iif,iam,parm,parms,ser,bord,nin,bootup,ans,hda",
]
exclude = { glob = [
    "**/*.DSS",
    "**/*.dss",
    "renewables/wind/plant/phenix-images/workstation/drivers/**",
    "renewables/wind/plant/phenix-injects/wind-test-harness/**",
    "renewables/wind/plant/simulation-replay/docs/**",
    "renewables/wind/plant/simulation-replay/grafana/dashboards/**",
    "renewables/wind/plant/simulation-replay/manager/wind_data_final/**",
] }
priority = 4

# Check shell scripts for common issues.
[[repos]]
repo = "https://github.com/shellcheck-py/shellcheck-py"
rev = "v0.11.0.1"

[[repos.hooks]]
id = "shellcheck"
args = [
    "--severity=warning",
    "--exclude=SC1090,SC1091",
]
exclude = '^renewables/wind/plant/(?:phenix-injects/wind-test-harness/|simulation-replay/(?:setup|manager/wait-for-elastic)$)'
priority = 4

# Validate YAML style and structure.
[[repos]]
repo = "https://github.com/adrienverge/yamllint.git"
rev = "v1.29.0"

[[repos.hooks]]
id = "yamllint"
args = [
    "--strict",
    "--config-file=.yamllint.yml",
]
priority = 4

# Enforce conventional commit messages.
[[repos]]
repo = "https://github.com/compilerla/conventional-pre-commit"
rev = "v4.4.0"

[[repos.hooks]]
id = "conventional-pre-commit"
stages = ["commit-msg"]
args = [
    "feat",
    "fix",
    "docs",
    "style",
    "refactor",
    "test",
    "chore",
]
priority = 4

# General repository hygiene checks built into prek.
[[repos]]
repo = "builtin"

[[repos.hooks]]
id = "trailing-whitespace"
args = ["--markdown-linebreak-ext=md"]
types_or = [
    "python",
    "markdown",
    "yaml",
    "json",
    "shell",
]
exclude = '^renewables/wind/plant/(phenix-injects/wind-test-harness|simulation-replay/manager/wind_data_final)/'
priority = 1

[[repos.hooks]]
# Only checks files staged for commit and ignores LFS-tracked files.
id = "check-added-large-files"
args = ["--maxkb=4096"]
priority = 4

[[repos.hooks]]
id = "check-case-conflict"
priority = 4

[[repos.hooks]]
id = "check-illegal-windows-names"
priority = 4

[[repos.hooks]]
id = "end-of-file-fixer"
types_or = [
    "python",
    "markdown",
    "yaml",
    "shell",
]
exclude = '^renewables/wind/plant/(phenix-injects/wind-test-harness|simulation-replay/docs)/'
priority = 2

[[repos.hooks]]
id = "fix-byte-order-marker"
priority = 0

[[repos.hooks]]
id = "check-yaml"
priority = 4

[[repos.hooks]]
id = "check-json"
exclude = '^renewables/wind/plant/simulation-replay/manager/wind_data_final/'
priority = 4

[[repos.hooks]]
id = "check-json5"
priority = 4

[[repos.hooks]]
id = "check-merge-conflict"
priority = 4

[[repos.hooks]]
id = "check-executables-have-shebangs"
exclude = { glob = [
    "renewables/wind/plant/phenix-images/workstation/drivers/**",
    "**/*.ps1",
    "**/*.bat",
] }
priority = 4

[[repos.hooks]]
id = "check-shebang-scripts-are-executable"
exclude = '(?:^renewables/wind/plant/phenix-injects/wind-test-harness/|\.mako$)'
priority = 4

[[repos.hooks]]
id = "check-symlinks"
priority = 4

[[repos.hooks]]
id = "check-toml"
priority = 4

[[repos.hooks]]
id = "mixed-line-ending"
args = ["--fix=no"]
exclude = '^renewables/wind/plant/phenix-images/workstation/drivers/'
priority = 4

[[repos.hooks]]
id = "check-vcs-permalinks"
description = "Ensures that links to VCS websites are permalinks"
priority = 4

[[repos.hooks]]
id = "check-xml"
priority = 4

[[repos.hooks]]
id = "no-commit-to-branch"
name = "branch name validation"
description = "Prevent commits to protected branches or non-kebab-case branches"
args = [
    "--branch",
    "main",
    "--branch",
    "master",
    "--pattern",
    '.*[^\w-].*',
]
priority = 4
