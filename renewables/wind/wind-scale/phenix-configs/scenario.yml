apiVersion: phenix.sandia.gov/v2
kind: Scenario
metadata:
  name: wind-scale
spec:
  apps:
    - name: scale
      metadata:
        profiles:
          - name: wtg
            plugin: wind_turbine
            count: 1
            containers_per_node: 6
            node_template:
              image: wind-scale-minimeta.qc2
              cpu: 4
              memory: 8192
            container_template:
              cpu: 1
              memory: 512
              rootfs_source: /phenix/images/wind-scale-otsimfs.tgz
              external_network:
                name: ot
                network: 192.168.100.0/24
                start_ip: 192.168.100.10
            ground-truth-module:
              elastic:
                endpoint: http://192.168.100.250:9200
                index-base-name: wind-turbine
                labels:
                  turbine: "{{turbine_name}}"
            templates:
              default:
                main-controller:
                  turbine:
                    type: E-126/4200
                    hubHeight: 135
                    roughnessLength: 0.15
                  logic:
                    speedTag: speed.high
                    directionTag: dir.high
                    directionError: 0.04
                  node-red:
                    flow: /phenix/injects/wind-scale/flows.json
                  weather:
                    columns:
                      - name: wind_speed
                        tags:
                          - {name: speed.high, height: 58.2}
                          - {name: speed.med, height: 36.6}
                          - {name: speed.low, height: 15.0}
                      - name: temperature
                        tags:
                          - {name: temp.high, height: 58.2}
                          - {name: temp.low, height: 3.0}
                      - name: pressure
                        tags:
                          - {name: pressure, height: 0.0}
                anemometer:
                  weather:
                    replayData: /phenix/injects/wind-scale/weather.csv
                    columns:
                      - {name: "Windspeed 58.2m", tag: speed.high}
                      - {name: "Windspeed 36.6m", tag: speed.med}
                      - {name: "Windspeed 15.0m", tag: speed.low}
                      - {name: "Wind Direction 58.2m", tag: dir.high}
                      - {name: "Wind Direction 36.6m", tag: dir.med}
                      - {name: "Wind Direction 15.0m", tag: dir.low}
                      - {name: "Temperature 58.2m", tag: temp.high}
                      - {name: "Temperature 3.0m", tag: temp.low}
                      - {name: "Barometric Pressure", tag: pressure}
                yaw-controller:
                  yaw:
                    initialPosition: 0
                    degreePerSecond: 0.1
